name = "csf-website"
type = "javascript"
account_id = ""
workers_dev = true
route = ""
zone_id = ""
main = ".opennext/worker.js"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[env.production]
name = "csf-website-prod"
routes = [
  { pattern = "example.com/*", zone_name = "example.com" }
]

[env.staging]
name = "csf-website-staging"
workers_dev = true

[build]
command = "npm run build:cloudflare"
cwd = "./"
watch_paths = ["app/**/*.tsx", "app/**/*.ts", "components/**/*.tsx", "public/**/*"]

# Environment variables
[env.production.vars]
ENVIRONMENT = "production"

[env.staging.vars]
ENVIRONMENT = "staging"

# KV namespace bindings (if needed for cache/sessions)
[[kv_namespaces]]
binding = "KV_STORE"
id = ""
preview_id = ""

# Durable Objects (if needed)
# [[durable_objects.bindings]]
# name = "COUNTER"
# class_name = "Counter"
# environment = "production"
